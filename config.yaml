# ==============================================================================
# AUDIO STUDIO: đọc truyện -> audio chương -> ghép tập với video nền lặp -> Drive
# ==============================================================================

paths:
  input_dir: "input"            # Chuong_0001.txt, Chuong_0002.txt ... (có thể để trong thư mục con)
  audio_dir: "output/audio"     # Chuong_0001.wav: audio chương đã hậu kỳ (WAV 24-bit, không nén)
  video_dir: "output/video"     # Chuong_0001-0010_Tap001.mp4
  work_dir: "work"              # giọng mẫu đã chọn, timeline chương, đơn vị lặp video nền, log

# --- Giọng clone ---
voice:
  ref_audio: "assets/voice/voice_reference_clean.wav"   # wav hoặc mp3; sạch, không nhạc nền. KHÔNG cần file .txt
  fallbacks: ["input/clone_voice_clean.wav", "input/clone_voice_clean.mp3"]
  # VieNeu chỉ lấy 8 s ĐẦU của giọng mẫu (cắt cứng, kể cả giữa chữ). Tool tự tìm các đoạn câu trọn vẹn
  # 3-7,8 s (đầu/cuối ở chỗ ngừng sạch), cho mỗi đoạn đọc thử vài câu của chương đầu rồi giữ đoạn
  # có giọng sinh ra GIỐNG giọng gốc nhất. Chọn 1 lần, lưu ở work/voice/ref_*.wav (+ .json điểm số).
  audition: true                # false: lấy luôn đoạn có chỗ ngắt câu đẹp nhất, không đọc thử
  audition_sentences: 6

# --- VieNeu-TTS v3 Turbo (https://github.com/pnnbao97/VieNeu-TTS) ---
# Tách câu, chuẩn hóa số/viết tắt, nhịp nghỉ (đoạn 0,7 s / câu 0,5 s / trong câu 0,3 s) đều theo VieNeu.
# Không có tham số tốc độ đọc: nhịp đọc đi theo giọng mẫu.
tts:
  # Giọng đã fine-tune (pod/train_voice.sh): đặt thư mục model đã merge + tên giọng trong đó.
  # Để null = clone tức thì từ voice.ref_audio bằng model gốc.
  backbone_repo: null           # ví dụ "/workspace/audio_studio/voice_lora/output/giong_doc_e3/merged"
  voice: null                   # ví dụ "Giọng đọc truyện"
  backend: "auto"               # auto = GPU (PyTorch) nếu có CUDA, không thì CPU (ONNX)
  precision: null               # chỉ cho CPU: "int8" nhanh ~1,6x nhưng cần CPU có VNNI
  denoise: true                 # VieNeu khử nhiễu giọng mẫu trước khi clone
  batch_size: 32                # GPU: số chunk sinh chung một lượt
  max_chars: 256                # độ dài tối đa 1 chunk (mặc định VieNeu)
  temperature: 0.8              # mặc định VieNeu (README: ~0.8 ổn định nhất)
  top_k: 25
  top_p: 0.95
  repetition_penalty: 1.2
  max_new_frames: 300

# --- Nghe lại bằng ASR: chunk sai chữ / lặp từ thì đọc lại, giữ bản tốt nhất ---
asr:
  enabled: true
  model_id: "vinai/PhoWhisper-large"   # PhoWhisper-medium nhẹ hơn nếu GPU nhỏ
  batch_size: 8                 # số chunk nghe lại mỗi lượt (hết VRAM thì tool tự chia nhỏ)
  max_cer: 0.12                 # tỷ lệ sai ký tự tối đa (không tính tên riêng trong input/names.txt)
  max_attempts: 3

# --- Hậu kỳ audio chương ---
master:
  enabled: true
  lufs: -14                     # độ to chuẩn YouTube (-16 nhỏ hơn ~2 dB)
  true_peak_db: -1.0            # limiter chặn đỉnh -> to mà không vỡ tiếng
  highpass_hz: 70               # lọc tiếng ù
  compressor: false             # như AI_Video_Studio: giữ dải động tự nhiên của giọng (nén làm giọng bẹt, đẩy tiếng thở/nền lên)
  deesser: false                # true nếu giọng mẫu nhiều tiếng xì (s, x)

# --- Ghép tập ---
episode:
  chapters_per_episode: 20      # số chương gộp thành 1 video
  watch_seconds: 60             # job video: bao lâu quét audio một lần
  inserts:                      # file chèn: after = chèn TRƯỚC chương thứ (after+1); "end" = cuối tập
    - {after: 0, file: "Kenh/Script_Intro.mp3"}
    - {after: 8, file: "Kenh/Script_Watermark.mp3"}
    - {after: 16, file: "Kenh/Script_Watermark1.mp3"}

video:
  background: "assets/background/background.mp4"   # video nền ngắn (1-2 phút), lặp đến hết audio
  fps: 30
  resolution: null              # null = giữ nguyên độ phân giải video nền; ví dụ [1920, 1080]
  crf: 18                       # chất lượng nén video nền (chỉ nén 1 lần cho đơn vị lặp)
  x264_preset: "medium"
  loop_crossfade_sec: 1.0       # hòa đuôi vào đầu để chỗ lặp không bị giật hình (0 = tắt)
  audio_bitrate: "192k"         # AAC 48 kHz stereo, nén 1 lần duy nhất
  insert_gap_sec: 0.4

# --- Google Drive qua rclone ---
# Tự lấy chương + tài nguyên từ Drive mỗi lần chạy: pod mới không cần upload gì.
# {project} được thay bằng tên bộ truyện khi chạy --project <tên> (trùng tên thư mục trên Drive),
# nên MỘT file cấu hình dùng được cho mọi bộ truyện.
sync:
  enabled: auto                 # auto = tự bật khi pod có rclone.conf (RunPod Secret RCLONE_CONF_B64)
  input: "gdrive:Dự án truyện/{project}/chuong"        # các file Chuong_XXXX.txt (+ glossary.json, names.txt)
  assets:                                              # thư mục trên pod <- thư mục Drive (bỏ dòng không dùng)
    assets/voice: "gdrive:Dự án truyện/{project}/voice"            # voice_reference_clean.wav + .txt
    assets/background: "gdrive:Dự án truyện/{project}/background"  # background.mp4
    Kenh: "gdrive:Dự án truyện/{project}/Kenh"                     # Script_Intro.mp3, Script_Watermark*.mp3
  refresh_minutes: 20           # trong lúc chạy, cứ 20 phút xem Drive có chương mới không
  skip_uploaded: true           # tập đã có trong upload.remote_dir -> bỏ qua, không đọc lại

upload:
  enabled: auto                 # auto = tự bật khi pod có rclone.conf (RunPod Secret RCLONE_CONF_B64)
  remote_dir: "gdrive:Dự án truyện/{project}/video"
  config_path: "rclone.conf"    # hoặc khai biến môi trường RCLONE_CONF_B64 trên RunPod (xem hướng dẫn)
  delete_after_upload: true     # xóa video trên pod sau khi đẩy thành công (để lại file .done)
  delete_audio_after_upload: true   # tập đã lên Drive thì xóa audio chương (ổ pod không đầy)
